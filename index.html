<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>스쿨히어로 · 서울 판타지</title>
<meta name="description" content="서울 지형을 배경으로 한 판타지 3D 액션 RPG · 스쿨히어로 1단계">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2322304d'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle'%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>

  <div id="hud">
    <!-- 플레이어 정보 -->
    <div class="player-card">
      <div class="avatar" id="avatar">🎓<span class="lv-chip" id="lvChip">Lv.1</span></div>
      <div class="pc-body">
        <div class="pc-name"><span id="pcName">스쿨히어로</span><span class="pc-zone" id="pcZone">여의도 시작의 숲</span></div>
        <div class="bar hp"><div class="fill" id="hpFill"></div><span class="bar-text" id="hpText">120 / 120</span></div>
        <div class="bar mp"><div class="fill" id="mpFill"></div><span class="bar-text" id="mpText">60 / 60</span></div>
        <div class="bar xp"><div class="fill" id="xpFill"></div></div>
      </div>
    </div>

    <div class="quest-track" id="questTrack"></div>

    <!-- 미니맵 + 메달 -->
    <div class="map-col">
      <div class="minimap-frame" id="minimapFrame" title="전체 지도">
        <canvas id="minimap" width="300" height="300"></canvas>
        <div class="minimap-hint">지도</div>
      </div>
      <div class="medal-block" id="medalBlock" title="구역 정보">
        <div class="medal-badge" id="medalBadge"><span id="medalNum">0</span></div>
        <div class="medal-gauge"><div class="medal-gauge-fill" id="medalGaugeFill"></div></div>
      </div>
    </div>

    <!-- 보스 체력 -->
    <div class="boss-bar hidden" id="bossBar">
      <div class="boss-name" id="bossName">보스</div>
      <div class="boss-hp"><div class="fill" id="bossHpFill"></div></div>
    </div>

    <div class="world-layer" id="worldLayer"></div>
    <div class="toasts" id="toasts"></div>
    <div class="zone-banner" id="zoneBanner"></div>
    <div class="death-veil" id="deathVeil"><div>쓰러졌어요…<small>잠시 뒤 다시 일어납니다</small></div></div>

    <!-- 조이스틱 -->
    <div class="joystick" id="joystick"><div class="joy-knob" id="joyKnob"></div></div>

    <!-- 오른쪽 메뉴 -->
    <div class="side-menu">
      <button class="round-btn" data-open="companions" title="동료"><span>🐾</span><small>동료</small></button>
      <button class="round-btn" data-open="stats" title="스탯"><span>💪</span><small>스탯</small></button>
      <button class="round-btn" data-open="quests" title="퀘스트"><span>📜</span><small>퀘스트</small></button>
      <button class="round-btn" data-open="settings" title="설정"><span>⚙️</span><small>설정</small></button>
      <button class="round-btn" data-open="help" title="도움말"><span>❔</span><small>도움말</small></button>
    </div>

    <!-- 하단 바 -->
    <div class="bottom-bar">
      <div class="equip-slots" id="equipSlots"></div>
      <div class="currencies">
        <div class="cur"><span>🪙</span><b id="goldText">0</b></div>
        <div class="cur"><span>👻</span><b id="soulText">0</b></div>
      </div>
      <div class="bar-btns">
        <button class="square-btn" data-open="bag"><span>🎒</span><small>가방</small></button>
        <button class="square-btn" data-open="merge"><span>⚗️</span><small>합성</small></button>
        <button class="square-btn" data-open="souls"><span>🌳</span><small>특성</small></button>
      </div>
    </div>

    <!-- NPC 말걸기 -->
    <button class="talk-btn hidden" id="talkBtn">말 걸기</button>
    <button class="talk-btn hidden" id="leaveBtn">귀환</button>
  </div>

  <div id="modalRoot"></div>

  <div id="loading">
    <div class="logo">스쿨히어로</div>
    <div class="logo-sub">서울 판타지 · 1단계</div>
    <div class="loading-bar"><div></div></div>
    <div class="loading-text" id="loadingText">모험을 준비하는 중…</div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
